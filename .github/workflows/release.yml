name: Release

# Push a tag like v1.2.0 to publish the jar as a GitHub release:
#   git tag v1.2.0 && git push origin v1.2.0
# Latest jar: https://github.com/kraudy/MasterCompiler/releases/latest/download/MasterCompiler.jar
# Windows (no Java needed): MasterCompiler-windows-x64.zip, the same jar with its own Java in runtime\

on:
  push:
    tags: [ 'v*' ]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write       # artifact attestation
      attestations: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'   # builds against the Java 8 API (release 8 in pom.xml)
          cache: maven

      - name: Build and run unit tests
        run: ./mvnw -B clean package -Dmc.version="$GITHUB_REF_NAME"   # --version prints the tag

      - name: Checksum
        run: |
          cp target/MasterCompiler.jar .
          sha256sum MasterCompiler.jar > MasterCompiler.jar.sha256       # check: sha256sum -c MasterCompiler.jar.sha256

      - name: Attest the jar   # check: gh attestation verify ... --signer-workflow kraudy/MasterCompiler/.github/workflows/release.yml (README)
        uses: actions/attest@v4
        with:
          subject-path: MasterCompiler.jar

      - name: Keep the jar for the Windows package
        uses: actions/upload-artifact@v4
        with:
          name: jar
          path: MasterCompiler.jar

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            MasterCompiler.jar MasterCompiler.jar.sha256 \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

  windows:
    # The same jar with a trimmed Java runtime (jlink), so Windows users install no Java
    needs: release
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write       # artifact attestation
      attestations: write

    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Get the released jar
        uses: actions/download-artifact@v4
        with:
          name: jar

      - name: Build the runtime and the zip
        shell: pwsh
        run: |
          # jdeps on the classes, plus what is loaded by name at run time (TLS / SSH EC crypto, the Windows certificate store, the 5250 secret page, charsets, Unsafe, JMX)
          $modules = 'java.base,java.datatransfer,java.desktop,java.logging,java.management,java.naming,java.security.jgss,java.sql,java.transaction.xa,java.xml,jdk.charsets,jdk.crypto.ec,jdk.crypto.mscapi,jdk.httpserver,jdk.unsupported'
          New-Item -ItemType Directory -Force MasterCompiler | Out-Null
          jlink --add-modules $modules --strip-debug --no-man-pages --no-header-files --compress=zip-6 --output MasterCompiler/runtime
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item MasterCompiler.jar MasterCompiler/
          $version = & MasterCompiler/runtime/bin/java.exe -jar MasterCompiler/MasterCompiler.jar --version
          Write-Output $version
          if ($version -ne "MasterCompiler $env:GITHUB_REF_NAME") { Write-Error "Unexpected version: $version"; exit 1 }
          # screen_open trusts the Windows certificate store: the runtime must have its provider
          $mods = & MasterCompiler/runtime/bin/java.exe --list-modules
          if (-not ($mods -match 'jdk.crypto.mscapi')) { Write-Error "The runtime has no jdk.crypto.mscapi"; exit 1 }
          Compress-Archive -Path MasterCompiler -DestinationPath MasterCompiler-windows-x64.zip

      - name: Attest the zip
        uses: actions/attest@v4
        with:
          subject-path: MasterCompiler-windows-x64.zip

      - name: Add it to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$env:GITHUB_REF_NAME" MasterCompiler-windows-x64.zip --repo "$env:GITHUB_REPOSITORY"
